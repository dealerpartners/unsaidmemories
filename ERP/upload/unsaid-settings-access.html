<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9fc;--card:#fff;--ink:#1a1c1e;--mut:#5a6355;--line:#dad9dd;--lo:#f4f3f7;--pri:#0a6400;--prit:#fff;--soft:#eaf4e8;--warn:#a85a00;--warnb:#fff3e0;--bad:#ba1a1a;--badb:#ffdad6;--ok:#2e7d32;--pur:#4a148c;--purb:#e8def8;

:root[data-theme="dark"]{--bg:#121214;--card:#1a1b1e;--ink:#ecedee;--mut:#a3aaa0;--line:#2e3033;--lo:#222427;--pri:#6fd25c;--prit:#0b1a08;--soft:#1b2a19;--warn:#f0a649;--warnb:#33260f;--bad:#ff8a80;--badb:#3a1a18;--ok:#7fd48a;--pur:#cdb4f6;--purb:#2b2140;color-scheme:dark}
html,body{height:100%}*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.5 var(--sans);display:flex;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
aside{width:280px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;flex:none;display:flex;flex-direction:column}

.ng{padding:14px 12px 4px;font-weight:600;font-size:13px}.ng.m{color:var(--mut);font-weight:500;padding:8px 12px}
.ni{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 12px 7px 24px;color:var(--ink);font-weight:500}
.ni:hover,.ni[aria-current=page]{background:var(--lo)}.ni[aria-current=page]{font-weight:600}.ni.d{color:var(--mut)}
.nw{font-size:10px;font-weight:700;background:var(--soft);color:var(--pri);border-radius:99px;padding:0 6px}
main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.hdr{height:56px;padding:0 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--card);z-index:5;flex:none}
.hdr h2{margin:0;font-size:16px;font-weight:600}.sp{flex:1}
.pg{padding:26px 28px 100px;max-width:1160px;width:100%}
h3{font-size:16px;font-weight:600;margin:0 0 4px}h4{font-size:14px;margin:0 0 2px;font-weight:600}.sub{color:var(--mut);margin:0 0 16px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}.pad{padding:16px}
.btn{background:var(--pri);color:var(--prit);border:1px solid var(--pri);padding:7px 14px;border-radius:6px;font-weight:600;font-size:12.5px}
.btn.g{background:var(--card);color:var(--ink);border-color:var(--line)}.btn.g:hover{background:var(--lo)}.btn.s{padding:3px 10px;font-size:12px}.btn.r{color:var(--bad)}.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.sc{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:left;width:100%}.sc:hover{border-color:var(--mut)}
.ic{width:36px;height:36px;border-radius:8px;background:var(--purb);color:var(--pur);display:grid;place-items:center;font-weight:700;flex:none}
input[type=text],input[type=email],input[type=date],input[type=number],select,textarea{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-align:left;color:var(--mut);padding:9px 14px;border-bottom:1px solid var(--line);font-weight:600;letter-spacing:.02em}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}tbody tr.c:hover{background:var(--lo);cursor:pointer}
.tg{font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px;background:var(--lo);white-space:nowrap}.tg.ok{background:var(--soft);color:var(--ok)}.tg.w{background:var(--warnb);color:var(--warn)}.tg.b{background:var(--badb);color:var(--bad)}.tg.p{background:var(--purb);color:var(--pur)}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.fl button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-weight:500}.fl button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.av{width:28px;height:28px;border-radius:50%;background:var(--purb);color:var(--pur);display:inline-grid;place-items:center;font-weight:700;font-size:12px;margin-right:9px;vertical-align:middle}
.lay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.rl button{display:flex;justify-content:space-between;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px}.rl button[aria-current=true]{background:var(--lo);font-weight:600}.rl small{color:var(--mut)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;color:var(--mut);font-weight:600}.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--pri)}
.cap{display:flex;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}.cap input{width:16px;height:16px;accent-color:var(--pri)}.cap span{flex:1}
.mh{display:flex;align-items:center;gap:10px;padding:11px 16px}.mh b{flex:1}
.sw{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.sw:first-child{border-top:0}.sw small{color:var(--mut);display:block}.sw input[type=checkbox]{width:18px;height:18px;accent-color:var(--pri);flex:none}
.sw select,.sw input[type=number]{width:150px;flex:none}
.warn{background:var(--warnb);color:var(--warn);border-radius:8px;padding:9px 12px;margin-bottom:10px;font-weight:500}
.bar{position:fixed;left:calc(280px + (100vw - 280px)/2);bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--card);border-radius:10px;padding:9px 10px 9px 16px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:20}.bar.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}.bar .btn{background:var(--card);color:var(--ink);border-color:var(--card)}.bar .g{background:transparent;color:var(--card);border-color:#888}
.ov{position:fixed;inset:0;background:rgba(10,10,12,.5);display:none;z-index:40;justify-content:center;align-items:center;padding:16px}.ov.on{display:flex}.ov.r{justify-content:flex-end;padding:0;align-items:stretch}
.md{background:var(--card);border-radius:12px;width:min(520px,100%);padding:22px;max-height:92vh;overflow:auto}.ov.r .md{border-radius:0;width:min(480px,100%);max-height:none;height:100%}
.f{display:grid;gap:5px;margin-bottom:12px}.f label,.lb{font-weight:600;font-size:12px}.ck{display:flex;gap:8px;align-items:center;margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--card);padding:9px 15px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60}.toast.on{opacity:1;transform:translate(-50%,0)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);gap:10px}.kv span:first-child{color:var(--mut)}
.note{color:var(--mut);font-size:12px;margin-top:30px}
@media (max-width:900px){body{flex-direction:column;overflow:auto}aside{width:100%;max-height:170px}.lay{grid-template-columns:1fr}.rl{display:flex;overflow-x:auto}.rl button{width:auto;white-space:nowrap;gap:8px}.bar{left:50%}main{overflow:visible}}
</style>
</head>
<body>

<main><div class="hdr"><h2 id="ht">Home</h2><span class="sp"></span><select id="brand" aria-label="Brand" style="width:190px"></select></div><div class="pg" id="v"></div><p class="note" style="padding:0 28px">Sample people and settings. Nothing here is saved.</p></main>
<div class="bar" id="bar" role="status"><span id="bn"></span><button class="btn g s" id="bd">Discard</button><button class="btn s" id="bs">Review and save</button></div>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="md" id="md"></div></div>

<script>
var $=function(s){return document.querySelector(s)},esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var MOD=[['Dashboard',['View operations vitals','View financial KPIs (GMV, margins)*','Customize widgets']],
['Orders',['View orders','Edit orders','Cancel and refund orders*','Dispatch to suppliers*','Print labels and slips','Manage returns','See supplier costs*']],
['Catalog',['View products','Create and edit products','Publish and unpublish','Change prices*','See blank costs and margins*','Manage blanks and print areas']],
['Design Studio',['Use the studio','Manage templates','Approve designs for publish','Manage design library']],
['Finance',['View reports','Create invoices, bills, expenses','Approve bills and payments*','Reconcile accounts','Post journal entries*','Close periods*','Manage chart of accounts','View payroll*','Manage taxes and 1099s*']],
['Contacts',['View customers','Edit customers','See personal data (email, phone, address)*','Export contacts*','Merge and delete*','Manage vendors and suppliers','See bank and tax details*']],
['Marketing',['View campaigns','Publish social posts','Spend on ads*','Send newsletters','Create discount codes','Manage connected channels']],
['Support',['View tickets','Reply to customers','Assign and escalate','Issue goodwill credits*','Moderate community posts','Manage SLAs and routing','Delete tickets*']],
['CMS',['Edit content','Publish to storefront','Edit navigation','Manage media','Edit SEO']],
['Settings',['Manage teammates*','Manage roles*','Billing and subscription*','Manage integrations','Create API tokens*','Security policies*','View activity log','Export workspace data*']],
['Developers',['View API keys*','Manage webhooks']]];
var CAPS=[];MOD.forEach(function(m,mi){m[1].forEach(function(l,ci){CAPS.push({m:mi,c:ci,l:l.replace('*',''),s:l.slice(-1)==='*'})})});
function bits(sp){return MOD.map(function(m){var s=sp[m[0]]||'';while(s.length<m[1].length)s+='0';return s})}
var R={Admin:{d:'Runs the workspace. Everything, including who has access. Locked.',lock:1,g:MOD.map(function(m){return Array(m[1].length+1).join('1')}),sc:'all',cost:'show',pii:'show',bank:'show',agg:0,bulk:'No limit'},
Warehouse:{d:'Picks, packs, ships, and reviews the dispatch queue.',g:bits({Dashboard:'100',Orders:'1101110',Catalog:'100000'}),sc:'all',cost:'hide',pii:'mask',bank:'hide',agg:0,bulk:'500'},
Designer:{d:'Builds designs and products. Never sees cost or customer data.',g:bits({Dashboard:'100',Catalog:'110000','Design Studio':'1101',Marketing:'100000'}),sc:'all',cost:'hide',pii:'hide',bank:'hide',agg:0,bulk:'100'},
'Team Member':{d:'General staff baseline. Start here, add only what the job needs.',g:bits({Dashboard:'100',Orders:'1100100',Catalog:'110000',Contacts:'1000000',Support:'1100000',CMS:'10000'}),sc:'all',cost:'hide',pii:'mask',bank:'hide',agg:0,bulk:'100'},
'Support Member':{d:'Answers customers. Goodwill credits go through limits.',g:bits({Dashboard:'100',Orders:'1000010',Contacts:'1110000',Support:'1111100'}),sc:'all',cost:'hide',pii:'show',bank:'hide',agg:0,bulk:'50'},
Partner:{ext:1,d:'Outside seller or creator. Sees only their own designs, orders, and payouts.',g:bits({Dashboard:'100',Orders:'1000000',Catalog:'110000','Design Studio':'1100',Finance:'100000000',Marketing:'100000'}),sc:'own',cost:'hide',pii:'hide',bank:'hide',agg:0,bulk:'25'},
Accountant:{ext:1,d:'Outside bookkeeper. Full Finance, nothing customer-facing.',g:bits({Dashboard:'110',Orders:'1000000',Finance:'110111101',Contacts:'1000001'}),sc:'all',cost:'show',pii:'hide',bank:'show',agg:0,bulk:'No limit'},
'Board Member':{ext:1,d:'Read-only reporting. Totals only, no drill-down into people or orders.',g:bits({Dashboard:'110',Finance:'100000000'}),sc:'all',cost:'show',pii:'hide',bank:'hide',agg:1,bulk:'0'}};
var BR=['Unsaid','ManageKube LLC','Gift Lab'];
var P=[{n:'Sunny A.',e:'sunny@example.com',r:{Unsaid:'Admin','ManageKube LLC':'Admin'},st:'Active',l:'2 min ago',tf:1},
{n:'Almeta R.',e:'almeta@example.com',r:{Unsaid:'Warehouse'},st:'Active',l:'Today',tf:1},
{n:'Dana K.',e:'dana@example.com',r:{Unsaid:'Designer','Gift Lab':'Designer'},st:'Active',l:'Today',tf:1},
{n:'Marcus T.',e:'marcus@example.com',r:{Unsaid:'Support Member'},st:'Active',l:'Yesterday',tf:0},
{n:'Jordan P.',e:'jordan@example.com',r:{Unsaid:'Team Member','Gift Lab':'Team Member'},st:'Invited',l:'Never',tf:0},
{n:'Priya N.',e:'priya@firm.example',r:{Unsaid:'Accountant','ManageKube LLC':'Accountant'},st:'Active',l:'Oct 29',tf:1,end:'Dec 31'},
{n:'Printonic',e:'ops@printonic.example',r:{Unsaid:'Partner'},st:'Active',l:'Oct 30',tf:1},
{n:'Lee W.',e:'lee@example.com',r:{Unsaid:'Board Member','ManageKube LLC':'Board Member'},st:'Active',l:'Oct 22',tf:0,end:'Jan 15'},
{n:'Casey B.',e:'casey@example.com',r:{Unsaid:'Support Member'},st:'Suspended',l:'Sep 14',tf:1}];
var S={role:'Designer',tab:'perm',pq:'',f:'all',sel:{},bz:'All brands',cmp:'Warehouse',look:'0.2',ev:'all'};
var ORIG=JSON.stringify(R);
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},2400)}
function modal(h,r){$('#md').innerHTML=h;$('#ov').className='ov on'+(r?' r':'')}function close(){$('#ov').className='ov'}
function has(role,m,c){return R[role].g[m].charAt(c)==='1'}
function cnt(role){var n=0;P.forEach(function(p){for(var b in p.r)if(p.r[b]===role)n++});return n}
function people(role){return P.filter(function(p){for(var b in p.r)if(p.r[b]===role)return true})}
function granted(role){var a=0,s=0;CAPS.forEach(function(c){if(has(role,c.m,c.c)){a++;if(c.s)s++}});return[a,s]}
function diffCount(){var o=JSON.parse(ORIG),n=0;for(var k in R){if(!o[k])continue;R[k].g.forEach(function(s,i){for(var j=0;j<s.length;j++)if(s.charAt(j)!==o[k].g[i].charAt(j))n++});['sc','cost','pii','bank','bulk'].forEach(function(f){if(R[k][f]!==o[k][f])n++})}return n}
function bar(){var n=diffCount();$('#bn').textContent=n+' unsaved change'+(n===1?'':'s')+' · affects '+cnt(S.role)+' people in '+S.role;$('#bar').classList.toggle('on',n>0)}
var NAV=[['G','Workspace'],['home','Home'],['general','General',1],['teammates','Teammates'],['roles','Roles and permissions',0,'New'],['external','External access',0,'New'],['approvals','Approvals and limits',0,'New'],['owners','Workspace owners'],['hours','Office hours',1],['brands','Brands'],['security','Security'],['activity','Activity log',0,'New'],['multi','Multilingual',1],['M','Accounting and Finance'],['M','CRM and Contacts'],['M','Catalog and Design'],['M','Marketing and Social'],['M','Operations and Orders'],['M','System and Personal']];
var TITLE={home:'Home',teammates:'Teammates',roles:'Roles and permissions',external:'External access',approvals:'Approvals and limits',owners:'Workspace owners',brands:'Brands',security:'Security',activity:'Activity log'};
function nav(cur){$('#nav').innerHTML=NAV.map(function(n){if(n[0]==='G')return'<div class="ng">'+n[1]+'</div>';if(n[0]==='M')return'<div class="ng m">'+n[1]+'</div>';return'<button class="ni'+(n[2]?' d':'')+'" data-n="'+n[0]+'"'+(n[0]===cur?' aria-current="page"':'')+'>'+n[1]+(n[3]?' <span class="nw">'+n[3]+'</span>':'')+'</button>'}).join('');
$('#nav').querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){if(b.classList.contains('d'))toast('Not part of this mockup');else location.hash=b.dataset.n}})}
var V={};
V.home=function(){var c=[['T','Teammates','Manage or invite teammates and see who has access to what.','teammates'],['R','Roles and permissions','Build roles from 64 permissions, set data access, and test who can do what.','roles'],['E','External access','Partners, your accountant, and board members, with end dates.','external'],['A','Approvals and limits','Set dollar limits and require a second person for risky actions.','approvals'],['O','Workspace owners','Choose who receives security and billing announcements.','owners'],['B','Brands','Run several businesses from one login with separate access.','brands'],['S','Security','Two-step sign-in, SSO, sessions, IP rules, and impersonation.','security'],['L','Activity log','Every sign-in, access change, export, and approval.','activity']];
return'<h3>Workspace</h3><p class="sub">The access area of Settings. Other groups are unchanged.</p><div class="cards">'+c.map(function(x){return'<button class="sc" data-go="'+x[3]+'"><span class="ic">'+x[0]+'</span><span><h4>'+x[1]+'</h4><span class="sub" style="margin:0">'+x[2]+'</span></span></button>'}).join('')+'</div>'};
function rolesOf(p){return Object.keys(p.r).filter(function(b){return S.bz==='All brands'||b===S.bz}).map(function(b){return'<span class="tg p">'+(S.bz==='All brands'?esc(b)+': ':'')+p.r[b]+'</span>'}).join(' ')}
V.teammates=function(){var rows=P.filter(function(p){var f=S.f;if(S.bz!=='All brands'&&!p.r[S.bz])return false;var ex=false;for(var b in p.r)if(R[p.r[b]].ext)ex=true;return f==='all'||(f==='invited'&&p.st==='Invited')||(f==='susp'&&p.st==='Suspended')||(f==='ext'&&ex)||(f==='no2fa'&&!p.tf)});
var n=Object.keys(S.sel).length;
return'<div class="row" style="margin-bottom:14px"><div><h3>Teammates</h3><p class="sub" style="margin:0">'+P.length+' people. A person can hold a different role in each brand.</p></div><span class="sp"></span><button class="btn" id="inv">Invite teammates</button></div><div class="fl">'+[['all','All'],['invited','Invited'],['susp','Suspended'],['ext','External'],['no2fa','No two-step']].map(function(x){return'<button data-f="'+x[0]+'" aria-pressed="'+(S.f===x[0])+'">'+x[1]+'</button>'}).join('')+'</div><div class="card">'+(n?'<div class="row pad" style="background:var(--lo)"><b>'+n+' selected</b><button class="btn g s" data-bk="Change role">Change role</button><button class="btn g s" data-bk="Suspend">Suspend</button><button class="btn g s" data-bk="Resend invite">Resend invite</button><span class="mut">This will change access for '+n+' people.</span></div>':'')+'<table><thead><tr><th style="width:30px"></th><th>Name</th><th>Role by brand</th><th>Status</th><th>Last active</th><th>Two-step</th></tr></thead><tbody>'+rows.map(function(p){var i=P.indexOf(p);return'<tr class="c" data-p="'+i+'"><td><input type="checkbox" data-s="'+i+'"'+(S.sel[i]?' checked':'')+' aria-label="Select '+esc(p.n)+'"></td><td><span class="av">'+p.n[0]+'</span><b>'+esc(p.n)+'</b><br><span class="sub" style="margin:0 0 0 37px">'+esc(p.e)+'</span></td><td>'+rolesOf(p)+(p.end?' <span class="tg w">Ends '+p.end+'</span>':'')+'</td><td><span class="tg '+(p.st==='Active'?'ok':p.st==='Invited'?'w':'b')+'">'+p.st+'</span></td><td>'+p.l+'</td><td>'+(p.tf?'<span class="tg ok">On</span>':'<span class="tg w">Off</span>')+'</td></tr>'}).join('')+'</tbody></table></div>'};
function sod(role){var w=[];if(has(role,4,1)&&has(role,4,2))w.push('Can create and approve bills and payments. Turn on “creator cannot approve own bills” in Approvals and limits, or split this role.');if(has(role,2,3)&&has(role,2,2))w.push('Can change prices and publish. Consider requiring approval for price changes.');if(has(role,9,0)&&has(role,9,1)&&role!=='Admin')w.push('Can manage teammates and roles. This is effectively admin access.');return w}
function moduleCard(role,mi){var m=MOD[mi],q=S.pq.toLowerCase(),lock=R[role].lock,n=0;m[1].forEach(function(l,c){if(has(role,mi,c))n++});

v.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){S.f=b.dataset.f;draw()}});
v.querySelectorAll('[data-ev]').forEach(function(b){b.onclick=function(){S.ev=b.dataset.ev;draw()}});
v.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(e){e.stopPropagation()};b.onchange=function(){if(b.checked)S.sel[b.dataset.s]=1;else delete S.sel[b.dataset.s];draw()}});
v.querySelectorAll('tr[data-p],button[data-p]').forEach(function(r){r.onclick=function(){drawer(+r.dataset.p)}});
v.querySelectorAll('[data-bk]').forEach(function(b){b.onclick=function(){bulk(b.dataset.bk)}});
v.querySelectorAll('[data-bz]').forEach(function(b){b.onclick=function(){S.bz=b.dataset.bz;$('#brand').value=S.bz;location.hash='teammates'}});
v.querySelectorAll('[data-x]').forEach(function(b){b.onclick=function(){toast(b.dataset.x+' form would open')}});
v.querySelectorAll('[data-t2]').forEach(function(b){b.onclick=function(){toast(b.dataset.t2)}});
var i=$('#inv');if(i)i.onclick=invite;
v.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){S.role=b.dataset.r;S.pq='';draw()}});
v.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){S.tab=b.dataset.t;draw()}});
v.querySelectorAll('[data-c]').forEach(function(b){b.onchange=function(){var a=b.dataset.c.split('.').map(Number),s=R[S.role].g[a[0]].split(''),n=MOD[a[0]][1].length;if(b.checked){s[a[1]]='1';if(a[1]>0)s[0]='1'}else{s[a[1]]='0';if(a[1]===0)s=Array(n+1).join('0').split('')}R[S.role].g[a[0]]=s.join('');draw()}});
v.querySelectorAll('[data-all]').forEach(function(b){b.onclick=function(){var mi=+b.dataset.all,n=MOD[mi][1].length,all=R[S.role].g[mi]===Array(n+1).join('1');R[S.role].g[mi]=Array(n+1).join(all?'0':'1');draw()}});
v.querySelectorAll('[data-d]').forEach(function(b){b.onchange=function(){R[S.role][b.dataset.d]=b.value;draw()}});
var ag=v.querySelector('[data-agg]');if(ag)ag.onchange=function(){R[S.role].agg=ag.checked?1:0;draw()};
var pq=$('#pq');if(pq)pq.oninput=function(){S.pq=pq.value;var p=pq.selectionStart;draw();var q=$('#pq');q.focus();q.setSelectionRange(p,p)};
var lk=$('#look');if(lk)lk.onchange=function(){S.look=lk.value;draw()};
var cm=$('#cmp');if(cm)cm.onchange=function(){S.cmp=cm.value;draw()};
var nr=$('#nr');if(nr)nr.onclick=function(){newRole()};var du=$('#dup');if(du)du.onclick=function(){newRole(S.role)};
var de=$('#del');if(de)de.onclick=function(){delete R[S.role];S.role='Team Member';draw();toast('Role deleted')}}
var cur='home';
function draw(){$('#v').innerHTML=V[cur]();nav(cur);$('#ht').textContent=TITLE[cur];bind();bar()}
function go(){var h=location.hash.slice(1);cur=V[h]?h:'home';draw();$('main').scrollTop=0}
$('#bd').onclick=function(){R=JSON.parse(ORIG);draw()};$('#bs').onclick=review;
$('#ov').onclick=function(e){if(e.target.id==='ov')close()};document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
$('#brand').innerHTML=['All brands'].concat(BR).map(function(b){return'<option>'+b+'</option>'}).join('');$('#brand').onchange=function(){S.bz=this.value;draw()};
window.addEventListener('hashchange',go);go();
</script>
</body>
</html>
